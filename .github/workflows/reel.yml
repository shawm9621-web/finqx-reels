name: Make Reel
on:
  workflow_dispatch:
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          npm init -y
          npm install puppeteer
      - name: Render frames
        env:
          MANIFEST_URL: ${{ secrets.MANIFEST_URL }}
        run: node render.js
      - name: Make video and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          ffmpeg -y -loglevel error -framerate 25 -i frames/f%04d.jpg -c:v libx264 -pix_fmt yuv420p -crf 20 video.mp4
          MUSIC=$(find . \( -path ./.git -o -path ./node_modules -o -path ./frames \) -prune -o -type f \( -iname '.mp3' -o -iname '.mpeg' -o -iname '.mpg' -o -iname '.m4a' -o -iname '.wav' -o -iname '.ogg' -o -iname '.aac' -o -iname '.opus' \) -print | head -n 1)
          echo "FOUND MUSIC: [$MUSIC]"
          if [ -n "$MUSIC" ]; then
            echo "MUSIC STREAMS:"
            ffprobe -v error -show_entries stream=codec_type,codec_name,duration -of default=nw=1 "$MUSIC" || true
            ffmpeg -y -loglevel error -stream_loop -1 -i "$MUSIC" -vn -t 15 -af "volume=1.8,afade=t=in:d=1,afade=t=out:st=13:d=2" -ar 44100 -ac 2 -c:a aac -b:a 160k bg.m4a
          else
            echo "NO MUSIC FOUND, silent"
            ffmpeg -y -loglevel error -f lavfi -i anullsrc=r=44100:cl=stereo -t 15 -c:a aac bg.m4a
          fi
          ffmpeg -y -loglevel error -i video.mp4 -i bg.m4a -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k -shortest reel.mp4
          echo "FINAL STREAMS:"
          ffprobe -v error -show_entries stream=codec_type,codec_name,duration -of default=nw=1 reel.mp4 || true
          echo "FINAL VOLUME:"
          ffmpeg -hide_banner -i reel.mp4 -vn -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume" || true
          CAPTION=$(jq -r '.caption' manifest.json | head -c 900)
          curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F video=@reel.mp4 -F width=1080 -F height=1920 -F supports_streaming=true -F caption="$CAPTION" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" -o tg.json
          jq '.ok' tg.json
          [ "$(jq -r '.ok' tg.json)" = "true" ]
