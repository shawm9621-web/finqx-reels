name: Make Reel
on:
  workflow_dispatch:
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make and send reel
        env:
          MANIFEST_URL: ${{ secrets.MANIFEST_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          curl -sSf "$MANIFEST_URL?t=$(date +%s)" -o manifest.json
          i=1
          for u in $(jq -r '.urls[]' manifest.json); do
            curl -sSf "$u" -o "s$i.jpg"
            i=$((i+1))
          done
          rm -f list.txt
          for i in 1 2 3 4 5; do
            ffmpeg -y -loglevel error -i "s$i.jpg" -vf "zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=75:s=1080x1920:fps=25,fade=t=in:st=0:d=0.4,fade=t=out:st=2.6:d=0.4,format=yuv420p" -frames:v 75 -c:v libx264 "c$i.mp4"
            echo "file 'c$i.mp4'" >> list.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy video.mp4
          if [ -f music.mp3 ]; then
            ffmpeg -y -loglevel error -stream_loop -1 -i music.mp3 -t 15 -af "afade=t=in:d=1,afade=t=out:st=13:d=2" bg.wav
          else
            ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=220:duration=15" -f lavfi -i "sine=frequency=277.18:duration=15" -f lavfi -i "sine=frequency=329.63:duration=15" -filter_complex "[0][1][2]amix=inputs=3,volume=2.2,tremolo=f=0.5:d=0.4,afade=t=in:d=1,afade=t=out:st=13:d=2" bg.wav
          fi
          ffmpeg -y -loglevel error -i video.mp4 -i bg.wav -c:v copy -c:a aac -b:a 128k -shortest reel.mp4
          CAPTION=$(jq -r '.caption' manifest.json | head -c 900)
          curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F video=@reel.mp4 -F width=1080 -F height=1920 -F supports_streaming=true -F caption="$CAPTION" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" -o tg.json
          jq '.ok' tg.json
          [ "$(jq -r '.ok' tg.json)" = "true" ]
