<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,Roboto,Arial,sans-serif;font-weight:800;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
var D = null, S = {}, T = 15;
var FF = "Inter, Roboto, sans-serif";
var SC = [[0, 3.5], [3.5, 6.5], [6.5, 9.5], [9.5, 12.5], [12.5, 15]];

function clamp(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function pr(t, s, d) { return clamp((t - s) / d); }
function eo(x) { return 1 - Math.pow(1 - x, 3); }
function eb(x) { var a = 1.70158, b = a + 1; return 1 + b * Math.pow(x - 1, 3) + a * Math.pow(x - 1, 2); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function mk(par, css, html) {
  var e = document.createElement("div");
  e.style.position = "absolute";
  e.style.cssText += css;
  if (html !== undefined) { e.innerHTML = html; }
  par.appendChild(e);
  return e;
}

function words(par, text, css) {
  var box = mk(par, css);
  var arr = [];
  var w = String(text).split(" ");
  for (var i = 0; i < w.length; i++) {
    var s = document.createElement("span");
    s.style.display = "inline-block";
    s.style.margin = "0 6px";
    s.textContent = w[i];
    box.appendChild(s);
    box.appendChild(document.createTextNode(" "));
    arr.push(s);
  }
  return { box: box, w: arr };
}

function up(e, p, d) {
  e.style.opacity = clamp(p * 1.6);
  e.style.transform = "translateY(" + ((1 - eo(p)) * d) + "px)";
}

function pop(e, p, extra) {
  var s = 0.2 + 0.8 * eb(p);
  e.style.opacity = clamp(p * 2.5);
  e.style.transform = "translateY(" + (extra || 0) + "px) scale(" + s + ")";
}

function icon(name, accent) {
  var W = "#ffffff";
  if (name === "phone") {
    return "<rect x='-55' y='-95' width='110' height='190' rx='26' fill='" + W + "'/>" +
      "<rect x='-42' y='-72' width='84' height='128' rx='10' fill='" + accent + "'/>" +
      "<circle cy='76' r='9' fill='" + accent + "'/>";
  }
  if (name === "card") {
    return "<rect x='-100' y='-65' width='200' height='130' rx='18' fill='" + W + "'/>" +
      "<rect x='-100' y='-35' width='200' height='28' fill='" + accent + "'/>" +
      "<rect x='-80' y='20' width='60' height='14' rx='7' fill='" + accent + "'/>";
  }
  if (name === "shield") {
    return "<path d='M0 -100 L80 -65 L80 10 Q80 75 0 105 Q-80 75 -80 10 L-80 -65 Z' fill='" + W + "'/>" +
      "<path d='M-35 5 l25 25 l45 -50' stroke='" + accent + "' stroke-width='14' fill='none' stroke-linecap='round' stroke-linejoin='round'/>";
  }
  if (name === "rocket") {
    return "<polygon points='-30,40 -75,95 -30,75' fill='" + accent + "'/>" +
      "<polygon points='30,40 75,95 30,75' fill='" + accent + "'/>" +
      "<path d='M0 -105 C45 -60 45 30 30 60 L-30 60 C-45 30 -45 -60 0 -105 Z' fill='" + W + "'/>" +
      "<circle cy='-30' r='20' fill='" + accent + "'/>" +
      "<polygon points='-18,62 18,62 0,110' fill='#FFB300'/>";
  }
  if (name === "chart") {
    return "<rect x='-95' y='10' width='38' height='80' rx='6' fill='" + W + "'/>" +
      "<rect x='-48' y='-20' width='38' height='110' rx='6' fill='" + W + "'/>" +
      "<rect x='0' y='-55' width='38' height='145' rx='6' fill='" + W + "'/>" +
      "<rect x='48' y='-95' width='38' height='185' rx='6' fill='" + accent + "'/>";
  }
  return "<circle r='90' fill='" + accent + "'/>" +
    "<circle r='68' fill='none' stroke='" + W + "' stroke-width='8'/>" +
    "<text y='20' font-family='" + FF + "' font-weight='700' font-size='54' text-anchor='middle' fill='" + W + "'>Rs</text>";
}

function iconSvg(name, accent, size) {
  return "<svg width='" + size + "' height='" + size + "' viewBox='-150 -150 300 300' xmlns='http://www.w3.org/2000/svg'>" + icon(name, accent) + "</svg>";
}

function tagFor(cat) {
  var c = String(cat).toLowerCase();
  if (c.indexOf("myth") >= 0) return "MYTH VS FACT";
  if (c.indexOf("side income") >= 0) return "SIDE INCOME";
  if (c.indexOf("motivation") >= 0) return "MOTIVATION";
  if (c.indexOf("digital") >= 0) return "STAY SAFE";
  if (c.indexOf("credit score") >= 0) return "CREDIT SCORE";
  if (c.indexOf("time") >= 0) return "PRODUCTIVITY";
  return "MONEY TIP";
}

function glowCss(x, y, size, color) {
  return "left:" + x + "px;top:" + y + "px;width:" + size + "px;height:" + size + "px;border-radius:50%;background:radial-gradient(circle," + color + "99 0%," + color + "00 70%);";
}

function build(d) {
  D = d;
  var th = d.theme;
  var st = document.getElementById("stage");

  mk(st, "left:0;top:0;width:1080px;height:1920px;background:linear-gradient(135deg," + th.g1 + "," + th.g2 + "," + th.g3 + ");");
  S.bg = null;
  if (d.bg) {
    S.bg = mk(st, "left:-60px;top:-100px;width:1200px;height:2120px;background-size:cover;background-position:center;opacity:0.45;background-image:url('" + d.bg + "');");
  }
  mk(st, "left:0;top:0;width:1080px;height:1920px;background:linear-gradient(180deg,rgba(0,0,0,0.30),rgba(0,0,0,0.08) 45%,rgba(0,0,0,0.55));");

  S.sh = [
    mk(st, "left:760px;top:60px;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,0.07);"),
    mk(st, "left:-220px;top:1480px;width:660px;height:660px;border-radius:50%;background:rgba(255,255,255,0.06);")
  ];

  S.sp = [];
  var sps = [[250, 480], [860, 450], [830, 860], [230, 820], [540, 1560]];
  for (var i = 0; i < sps.length; i++) {
    S.sp.push(mk(st, "left:" + sps[i][0] + "px;top:" + sps[i][1] + "px;width:26px;height:26px;background:" + th.accent2 + ";border-radius:4px;opacity:0;"));
  }

  S.sc = [];
  for (var k = 0; k < 5; k++) {
    S.sc.push(mk(st, "left:0;top:0;width:1080px;height:1920px;"));
  }

  // scene 0: cover
  var c = S.sc[0];
  c.g = mk(c, glowCss(210, 320, 660, th.accent));
  c.ic = mk(c, "left:300px;top:410px;width:480px;height:480px;", iconSvg(d.icon, th.accent, 480));
  c.tag = mk(c, "left:700px;top:250px;width:320px;height:64px;border-radius:32px;background:" + th.accent + ";color:" + th.ink + ";font-size:30px;line-height:64px;text-align:center;", esc(tagFor(d.category)));
  c.t = words(c, d.cover_title, "left:60px;top:960px;width:960px;text-align:center;color:#ffffff;font-size:96px;line-height:112px;");
  c.sub = mk(c, "left:60px;top:1340px;width:960px;text-align:center;color:" + th.accent2 + ";font-size:44px;line-height:58px;", esc(d.cover_sub));

  // scenes 1 to 3: content
  for (var n = 1; n <= 3; n++) {
    var sl = d.slides[n - 1];
    var s = S.sc[n];
    s.num = mk(s, "left:50px;top:440px;width:160px;height:160px;border-radius:50%;background:" + th.accent + ";color:" + th.ink + ";font-size:96px;line-height:160px;text-align:center;", "" + n);
    s.g = mk(s, glowCss(710, 330, 380, th.accent));
    s.ic = mk(s, "left:795px;top:415px;width:210px;height:210px;", iconSvg(d.icon, th.accent, 210));
    s.t = words(s, sl.title, "left:60px;top:690px;width:960px;color:#ffffff;font-size:74px;line-height:90px;");
    s.bar = mk(s, "left:60px;top:890px;width:0px;height:14px;border-radius:7px;background:" + th.accent + ";");
    s.card = mk(s, "left:60px;top:950px;width:960px;height:550px;border-radius:40px;background:#ffffff;box-shadow:0 14px 0 rgba(0,0,0,0.22);");
    mk(s.card, "left:0;top:0;width:16px;height:550px;background:" + th.accent + ";border-radius:40px 0 0 40px;");
    s.b = words(s.card, sl.body, "left:55px;top:50px;width:850px;color:" + th.ink + ";font-size:50px;line-height:86px;");
  }

  // scene 4: call to action
  var z = S.sc[4];
  z.g = mk(z, glowCss(210, 320, 660, th.accent));
  z.ic = mk(z, "left:300px;top:410px;width:480px;height:480px;", iconSvg(d.icon, th.accent, 480));
  z.a = mk(z, "left:60px;top:1000px;width:960px;text-align:center;color:#ffffff;font-size:98px;line-height:120px;", "Download the");
  z.b = mk(z, "left:60px;top:1125px;width:960px;text-align:center;color:" + th.accent + ";font-size:116px;line-height:130px;", "Finqx app");
  z.c = mk(z, "left:60px;top:1275px;width:960px;text-align:center;color:" + th.accent2 + ";font-size:48px;line-height:60px;", "Learn. Earn. Grow.");
  z.btn = mk(z, "left:240px;top:1370px;width:600px;height:100px;border-radius:50px;background:" + th.accent + ";color:" + th.ink + ";font-size:46px;line-height:100px;text-align:center;", "Get it now");

  // logo and progress (always visible)
  mk(st, "left:60px;top:240px;width:210px;height:64px;padding-left:30px;border-radius:32px;background:#ffffff;color:" + th.ink + ";font-size:36px;line-height:64px;text-align:center;", "FINQX");
  mk(st, "left:85px;top:259px;width:26px;height:26px;border-radius:50%;background:" + th.accent + ";");
  mk(st, "left:60px;top:210px;width:960px;height:10px;border-radius:5px;background:rgba(255,255,255,0.25);");
  S.pf = mk(st, "left:60px;top:210px;width:0px;height:10px;border-radius:5px;background:" + th.accent + ";");
}

function upCover(l) {
  var c = S.sc[0];
  pop(c.g, pr(l, 0, 0.6));
  pop(c.ic, pr(l, 0.1, 0.7), Math.sin(l * 3) * 14);
  up(c.tag, pr(l, 0.3, 0.4), -50);
  for (var i = 0; i < c.t.w.length; i++) {
    up(c.t.w[i], pr(l, 0.6 + i * 0.13, 0.35), 50);
  }
  up(c.sub, pr(l, 1.9, 0.5), 30);
}

function upContent(s, l) {
  pop(s.num, pr(l, 0, 0.5));
  pop(s.g, pr(l, 0, 0.6));
  pop(s.ic, pr(l, 0.1, 0.6), Math.sin(l * 3) * 10);
  for (var i = 0; i < s.t.w.length; i++) {
    up(s.t.w[i], pr(l, 0.25 + i * 0.1, 0.35), 50);
  }
  s.bar.style.width = (150 * eo(pr(l, 0.9, 0.4))) + "px";
  var p = pr(l, 0.6, 0.7);
  s.card.style.opacity = clamp(p * 3);
  s.card.style.transform = "translateY(" + ((1 - eb(p)) * 520) + "px)";
  for (var j = 0; j < s.b.w.length; j++) {
    up(s.b.w[j], pr(l, 1.2 + j * 0.07, 0.3), 20);
  }
}

function upCta(l) {
  var z = S.sc[4];
  pop(z.g, pr(l, 0, 0.6));
  pop(z.ic, pr(l, 0.1, 0.7), Math.sin(l * 3) * 14);
  up(z.a, pr(l, 0.3, 0.45), 60);
  pop(z.b, pr(l, 0.55, 0.6));
  up(z.c, pr(l, 1.0, 0.4), 30);
  var p = pr(l, 1.3, 0.5);
  var pulse = 1 + 0.05 * Math.sin(l * 6);
  z.btn.style.opacity = clamp(p * 2.5);
  z.btn.style.transform = "scale(" + ((0.3 + 0.7 * eb(p)) * pulse) + ")";
}

function draw(t) {
  if (S.bg) {
    S.bg.style.transform = "scale(" + (1 + 0.15 * t / T) + ") translate(" + (-t * 3) + "px,0px)";
  }
  S.sh[0].style.transform = "translate(" + (Math.sin(t * 0.8) * 40) + "px," + (Math.cos(t * 0.6) * 30) + "px)";
  S.sh[1].style.transform = "translate(" + (Math.cos(t * 0.7) * 40) + "px," + (Math.sin(t * 0.5) * 30) + "px)";
  for (var i = 0; i < S.sp.length; i++) {
    var o = Math.abs(Math.sin(t * 2 + i * 1.3));
    S.sp[i].style.opacity = 0.2 + 0.8 * o;
    S.sp[i].style.transform = "rotate(45deg) scale(" + (0.6 + 0.8 * o) + ")";
  }
  S.pf.style.width = (960 * t / T) + "px";
  for (var k = 0; k < 5; k++) {
    var a = SC[k][0], b = SC[k][1], l = t - a, root = S.sc[k];
    if (t < a || t >= b) { root.style.display = "none"; continue; }
    root.style.display = "block";
    root.style.opacity = (k < 4) ? (1 - pr(l, (b - a) - 0.35, 0.35)) : 1;
    if (k === 0) { upCover(l); }
    else if (k < 4) { upContent(S.sc[k], l); }
    else { upCta(l); }
  }
}

window.build = build;
window.draw = draw;
</script>
</body>
</html>
